name: Bug Bounty Dashboard Agent

on:
  schedule:
    # Täglich um 06:00 UTC (08:00 MEZ)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Manueller Start über GitHub UI jederzeit möglich
    inputs:
      mode:
        description: "Modus"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - health-only
          - research-only

jobs:
  bb-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # für git push
      issues: write      # für GitHub Issues

    steps:
      - name: 🔄 Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Dependencies installieren
        run: pip install requests

      - name: 🤖 Agent ausführen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: python agent/bb_agent.py

      - name: 💾 Änderungen committen
        run: |
          git config user.name  "BB Agent 🤖"
          git config user.email "bb-agent@users.noreply.github.com"
          git add tools.json agent/report.md
          git diff --cached --quiet || git commit -m "🤖 Daily update $(date '+%Y-%m-%d'): health check + research"
          git push
